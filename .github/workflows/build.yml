name: Build image

# Builds the SD card image on every push and pull request, and on demand.
# A tag like v0.1.0 also publishes the image as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      console:
        description: 'arkos4clone console folder (e.g. "r36max type1", "r36max type3")'
        default: 'r36max type1'
      kernel:
        description: 'Kernel the image starts: 5.10 or 4.4'
        default: '5.10'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (draws every screen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Draw the desktop and its windows with made-up data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pygame python3-pyte fonts-dejavu-core >/dev/null
          cd shell
          python3 -m compileall -q rkshell
          python3 tests/test_device.py
          python3 tests/test_sound.py
          python3 tests/test_mouse.py
          python3 tests/test_pointer.py
          python3 tests/test_wifi.py
          python3 tests/test_update.py
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens-640x480 --size 640x480
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens-480x320 --size 480x320
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-screens
          path: |
            screens/
            screens-640x480/
            screens-480x320/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Image (${{ inputs.console || 'r36max type1' }}, kernel ${{ inputs.kernel || '5.10' }})
    runs-on: ubuntu-24.04-arm        # arm64, like the handhelds: Debian installs natively
    timeout-minutes: 60
    env:
      CONSOLE: ${{ inputs.console || 'r36max type1' }}
      KERNEL: ${{ inputs.kernel || '5.10' }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # arkos4clone is large; only the boot chain, the boot files, the list of
      # consoles and the kernel modules are fetched, at the pinned commit.
      - name: Fetch the pinned arkos4clone files
        run: |
          . build/upstream.env
          git clone --quiet --filter=blob:none --no-checkout "$UPSTREAM_REPO" upstream
          cd upstream
          git sparse-checkout init --no-cone
          git sparse-checkout set /uboot/ /boot/dArkOS/consoles/ /dtbTools/internal/console/ /rootfs/dArkOS/usr/lib/modules/ \
            /rootfs/dArkOS/usr/lib/aarch64-linux-gnu/mali/libmali-bifrost-g31-g29p1.so \
            /rootfs/dArkOS/home/ark/.quirks/rotate/sdl2/64/libSDL2-2.0.so.0.3200.10.norotate \
            /rootfs/dArkOS/opt/inttools/gamecontrollerdb.txt
          git checkout --quiet "$UPSTREAM_COMMIT"
          du -sh uboot boot/dArkOS/consoles rootfs/dArkOS/usr/lib/modules

      # Debian trixie builds Debian trixie: the same debootstrap, keys and
      # filesystem tools as the system that ends up on the card.
      - name: Build and verify the image
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            -e CONSOLE -e KERNEL -e VERSION debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends debootstrap dosfstools e2fsprogs mtools fdisk xz-utils python3 ca-certificates device-tree-compiler >/dev/null
              build/build-image.sh upstream out
            '
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: rk3326-linux-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0        # the image is already xz-compressed

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # only the image: the desktop's screenshots are folders, and a release takes files
      - uses: actions/download-artifact@v7
        with:
          pattern: rk3326-linux-*
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # a run that failed half-way leaves a draft behind; start clean (the tag stays)
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "RK3326 Linux ${GITHUB_REF_NAME#v}" --generate-notes
