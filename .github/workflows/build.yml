name: Build image

# Builds the SD card image on every push and pull request, and on demand.
# A tag like v0.1.0 also publishes the image as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      console:
        description: 'arkos4clone console folder (e.g. "r36max type1", "r36max type3")'
        default: 'r36max type1'
      kernel:
        description: 'Kernel the image starts: 5.10 or 4.4'
        default: '5.10'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (draws every screen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Draw the desktop and its windows with made-up data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pygame python3-pyte fonts-dejavu-core >/dev/null
          cd shell
          python3 -m compileall -q rkshell
          python3 tests/test_device.py
          python3 tests/test_sound.py
          python3 tests/test_mouse.py
          python3 tests/test_pointer.py
          python3 tests/test_wifi.py
          python3 tests/test_update.py
          python3 tests/test_video.py
          python3 tests/test_rotate.py
          python3 tests/test_preflight.py
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens-640x480 --size 640x480
          SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots ../screens-480x320 --size 480x320
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-screens
          path: |
            screens/
            screens-640x480/
            screens-480x320/
          if-no-files-found: error
          retention-days: 14

  # One image for every RK3326 handheld arkos4clone supports. None but the
  # R36MAX is on the bench, so each one's boot files, screen, pad and power
  # chip are read from its device tree and held against what the system
  # expects, and the desktop is drawn at each one's screen size.
  handhelds:
    name: Handhelds (every console's boot files, screen and pad)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pinned arkos4clone consoles
        run: |
          . build/upstream.env
          git clone --quiet --filter=blob:none --no-checkout "$UPSTREAM_REPO" upstream
          cd upstream
          git sparse-checkout init --no-cone
          git sparse-checkout set /boot/dArkOS/consoles/
          git checkout --quiet "$UPSTREAM_COMMIT"
      - name: Check every handheld
        run: |
          python3 build/check-consoles.py upstream/boot/dArkOS/consoles --table devices.md
          # the list in the repository is the one this commit of arkos4clone gives
          diff -u docs/devices.md devices.md || { echo "docs/devices.md is out of date: run build/check-consoles.py <consoles> --table docs/devices.md"; exit 1; }
      - name: Draw the desktop at every handheld's screen size
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pygame python3-pyte fonts-dejavu-core >/dev/null
          cd shell
          for size in $(python3 ../build/check-consoles.py ../upstream/boot/dArkOS/consoles --sizes); do
            echo "== $size"
            SDL_VIDEODRIVER=dummy python3 -m rkshell --demo --shots "../handheld-screens/$size" --size "$size"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: handheld-screens
          path: handheld-screens/
          if-no-files-found: error
          retention-days: 14

  emulators:
    name: Emulators (RetroArch and its cores)
    runs-on: ubuntu-24.04-arm        # arm64: RetroArch is compiled for the handheld's processor
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: The bundle number is the same everywhere
        run: |
          . build/emulators.env
          [ "$(head -1 overlay/usr/share/rk/emulators.bundle)" = "$BUNDLE" ] || { echo "overlay/usr/share/rk/emulators.bundle does not say $BUNDLE (build/emulators.env)"; exit 1; }
      - name: Build the bundle
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends git ca-certificates build-essential pkg-config unzip xz-utils \
              libdrm-dev libgbm-dev libegl-dev libgles-dev libasound2-dev libudev-dev libfreetype-dev zlib1g-dev librga-dev libpng-dev patch >/dev/null
            build/build-emulators.sh emu-out
          '
          sudo chown -R "$(id -u):$(id -g)" emu-out
          ls -la emu-out
      - uses: actions/upload-artifact@v7
        with:
          name: rk-emulators
          path: emu-out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  image:
    name: Image (${{ inputs.console || 'r36max type1' }}, kernel ${{ inputs.kernel || '5.10' }})
    needs: emulators
    runs-on: ubuntu-24.04-arm        # arm64, like the handhelds: Debian installs natively
    timeout-minutes: 60
    env:
      CONSOLE: ${{ inputs.console || 'r36max type1' }}
      KERNEL: ${{ inputs.kernel || '5.10' }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # arkos4clone is large; only the boot chain, the boot files, the list of
      # consoles, the kernel modules and the network adapters' firmware
      # (build/firmware-upstream.txt) are fetched, at the pinned commit.
      - name: Fetch the pinned arkos4clone files
        run: |
          . build/upstream.env
          git clone --quiet --filter=blob:none --no-checkout "$UPSTREAM_REPO" upstream
          cd upstream
          git sparse-checkout init --no-cone
          set -f      # the firmware names hold * for git, not for the shell
          git sparse-checkout set /uboot/ /boot/dArkOS/consoles/ /dtbTools/internal/console/ /rootfs/dArkOS/usr/lib/modules/ \
            /rootfs/dArkOS/usr/lib/aarch64-linux-gnu/mali/libmali-bifrost-g31-g29p1.so \
            /rootfs/dArkOS/home/ark/.quirks/rotate/sdl2/64/libSDL2-2.0.so.0.3200.10.norotate \
            /rootfs/dArkOS/home/ark/.quirks/rotate/sdl2/64/libSDL2-2.0.so.0.3200.10.rotate90 \
            /rootfs/dArkOS/home/ark/.quirks/rotate/sdl2/64/libSDL2-2.0.so.0.3200.10.rotate180 \
            /rootfs/dArkOS/home/ark/.quirks/rotate/sdl2/64/libSDL2-2.0.so.0.3200.10.rotate270 \
            /rootfs/dArkOS/opt/inttools/gamecontrollerdb.txt \
            $(grep -vE '^\s*(#|$)' ../build/firmware-upstream.txt | sed 's#^#/rootfs/dArkOS/usr/lib/firmware/#')
          set +f
          git checkout --quiet "$UPSTREAM_COMMIT"
          du -sh uboot boot/dArkOS/consoles rootfs/dArkOS/usr/lib/modules rootfs/dArkOS/usr/lib/firmware

      - uses: actions/download-artifact@v7
        with:
          name: rk-emulators
          path: emu

      # Debian trixie builds Debian trixie: the same debootstrap, keys and
      # filesystem tools as the system that ends up on the card.
      - name: Build and verify the image
        run: |
          . build/emulators.env
          export EMULATORS="/src/emu/rk-emulators-$BUNDLE.tar.xz"
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            -e CONSOLE -e KERNEL -e VERSION -e EMULATORS debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends debootstrap dosfstools e2fsprogs mtools fdisk xz-utils python3 ca-certificates device-tree-compiler >/dev/null
              build/build-image.sh upstream out
            '
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: rk3326-linux-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0        # the image is already xz-compressed

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, emulators, handhelds, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # only the image: the desktop's screenshots are folders, and a release takes files
      - uses: actions/download-artifact@v7
        with:
          pattern: rk3326-linux-*
          path: out
          merge-multiple: true
      # and the emulator bundle that is inside the image, as a file of its own:
      # a handheld flashed before Games existed fetches it from the release
      # (rk-tools install-media looks through this repository's releases for it)
      - uses: actions/download-artifact@v7
        with:
          name: rk-emulators
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # a run that failed half-way leaves a draft behind; start clean (the tag stays)
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          # v1.2.0-rc.1 and the like are pre-releases: never "the latest release"
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" $pre \
            --title "RK3326 Linux ${GITHUB_REF_NAME#v}" --generate-notes
