# What RetroArch needs to work on this handheld. Games on the dock starts it
# with --appendconfig, so these lines win over ~/.config/retroarch/retroarch.cfg
# at every start; everything else in that file stays yours.

# The picture goes through SDL2 (dArkOS's, on the Mali driver), the one road
# to this panel. The pad is read through SDL2 as well, so it is laid out by
# the handheld's controller database and needs no autoconfig files.
video_driver = "sdl2"
video_fullscreen = "true"
input_joypad_driver = "sdl2"
audio_driver = "alsa"
audio_device = "default"
menu_driver = "rgui"

# SELECT+START leaves, as in every dock app. The menu (save states, options)
# is both sticks pressed in.
input_quit_gamepad_combo = "4"
input_menu_toggle_gamepad_combo = "2"

# Cores come from Debian's packages; games and BIOS files are the owner's
# own, on the data partition, where a reflash keeps them.
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
rgui_browser_directory = "/data/ark/roms"
system_directory = "/data/ark/roms/bios"
savefile_directory = "/data/ark/roms/saves"
savestate_directory = "/data/ark/roms/states"
menu_show_core_updater = "false"
