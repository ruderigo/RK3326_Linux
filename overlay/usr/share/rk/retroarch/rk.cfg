# What RetroArch needs to work on this handheld. Games on the dock starts it
# with --appendconfig, so these lines win over ~/.config/retroarch/retroarch.cfg
# at every start; everything else in that file stays yours.

# The picture: OpenGL ES straight to the panel (KMS), on dArkOS's Mali driver.
# The settings dArkOS itself uses on RK3326 handhelds.
video_driver = "gl"
video_fullscreen = "true"
video_threaded = "true"
video_vsync = "true"
video_max_swapchain_images = "3"
audio_driver = "alsathread"
audio_device = "default"
menu_driver = "rgui"

# The pad, by its kernel buttons (the layout is in autoconfig/udev here).
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/rk/retroarch/autoconfig"

# SELECT is the hotkey button, as on dArkOS: SELECT+START leaves (once, as in
# every dock app) and SELECT+X opens the menu (save states, options).
input_enable_hotkey_btn = "12"
input_exit_emulator_btn = "13"
input_menu_toggle_btn = "2"
input_menu_toggle_gamepad_combo = "0"
quit_press_twice = "false"

# Cores come with the emulator bundle; games and BIOS files are the owner's
# own, on the data partition, where a reflash keeps them.
libretro_directory = "/opt/rk-emulators/cores"
libretro_info_path = "/opt/rk-emulators/cores"
rgui_browser_directory = "/data/ark/roms"
system_directory = "/data/ark/roms/bios"
savefile_directory = "/data/ark/roms/saves"
savestate_directory = "/data/ark/roms/states"
# One file for every core's options, at a place the Games window knows: it
# writes the few it offers as choices there (the N64 picture) before a game
# starts. Everything else changed in RetroArch's Core Options is kept in it.
global_core_options = "true"
core_options_path = "/home/ark/.config/retroarch/rk-core-options.cfg"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
